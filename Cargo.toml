[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# gpui-fast: GPUI with retained views, list rows kept across frames and scroll layers, so a
# notified view is drawn without rebuilding everything around it.
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }

# The macOS renderer, platform layer and rasterizers stay optimized in debug builds
# so the dev app's frame times resemble a release build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-apple = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-apple = { opt-level = 3 }
gpui-fast-macos = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
taffy = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
# Reading changes: hashing and comparing files, diffing lines and parsing them for colour
# are what a debug build is slowest at.
gix-diff = { opt-level = 3 }
gix-hash = { opt-level = 3 }
gix-imara-diff = { opt-level = 3 }
gix-index = { opt-level = 3 }
gix-object = { opt-level = 3 }
gix-status = { opt-level = 3 }
sha1dc = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
syntect = { opt-level = 3 }
fancy-regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
