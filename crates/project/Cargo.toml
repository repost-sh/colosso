[package]
name = "colosso-project"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Gitignore rules matched as git matches them: ripgrep's matchers, already in the lockfile.
ignore = "0.4"
# Subscriptions are streams, so any executor can wait on them.
futures = "0.3"
log = "0.4"
# Go to File's fuzzy matching: Helix's matcher, which scores like fzf, with paths in mind.
# The matcher alone: `Finder` drives it over the folders on threads of its own.
nucleo-matcher = "0.3"
# The pool those threads are, made once per finder; already in the lockfile.
rayon = "1.12"

# On macOS, FSEvents driven directly, through the bindings `notify` builds on: notify hands
# reports over one by one, which a burst outruns (see `src/watcher/fsevents.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "FSEvents", "dispatch2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

# Elsewhere, the platform's watcher through `notify`, the version GPUI already pulls in.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8"

[lints]
workspace = true
