[package]
name = "colosso-termd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "colosso_termd"
path = "src/lib.rs"

[[bin]]
name = "colosso-termd"
path = "src/main.rs"

[[bin]]
name = "colosso-term"
path = "src/bin/colosso-term.rs"

[dependencies]
colosso-term-control = { path = "../term-control" }
colosso-term-engine = { path = "../term-engine" }
bytes = "1"
# Timestamps in the log and the activity files; the version the app already builds.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The session thread selects over its PTY, its commands and its timers.
crossbeam-channel = "0.5"
# The home folder, for `path:~/...` selectors.
dirs = "6"
# Peer credentials on the socket and signals to the child's process group.
libc = "0.2"
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
# The pseudo-terminal, as agent-terminal opens it.
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The MCP server end to end, over a pipe, against the daemon the tests start.
colosso-term-mcp = { path = "../term-mcp" }
# The error the server's app tools answer with when no app runs.
colosso-app-control = { path = "../app-control" }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time"] }

[lints]
workspace = true
