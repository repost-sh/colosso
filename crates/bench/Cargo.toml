[package]
name = "koyo-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The editor under measurement. `test-support` brings the off-screen windows on the real
# macOS platform, so text is shaped and painted as the app does it; the grammars are the
# fixtures' languages, with Markdown's inline grammar for what its code blocks inject. Only
# this crate turns them on.
gpui-kit = { workspace = true, features = [
  "test-support",
  "tree-sitter",
  "tree-sitter-rust",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
] }
anyhow = "1"
# The scan scenarios: a checkout listed and watched as the app lists and watches it.
koyo-project = { path = "../project" }
# The results file and the scenario reports passed from each run back to the harness; the
# versions GPUI already pulls in.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The terminal scenarios: the daemon, run as this program's `termd` as the app runs itself, a
# client of it, and the engine the app's view takes the output into.
koyo-termd = { path = "../termd" }
koyo-term-control = { path = "../term-control" }
koyo-term-engine = { path = "../term-engine" }
crossbeam-channel = "0.5"
# A bare pseudo-terminal, opened as the daemon opens its own: how fast the PTY alone carries
# what `term-cat` shows, its master read non-blocking (`fcntl`, `poll`) as fast as it goes.
portable-pty = "0.9"
libc = "0.2"

[lints]
workspace = true
