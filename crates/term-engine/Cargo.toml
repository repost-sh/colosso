[package]
name = "colosso-term-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Ghostty's terminal core (libghostty-vt) through the gpui-cn bindings, pinned exactly: the
# C API is pre-1.0 and the snapshot format is shared with the daemon. 0.8.0 is Ghostty
# 1.4.0-main at commit 83fb956 (the lockfile keeps the full version). Built from Ghostty's
# source tarball with the Zig that script/zig pins (see .cargo/config.toml).
ghostty-vt = { version = "=0.8.0", features = ["log"] }
log = "0.4"

[lints]
workspace = true
