[package]
name = "colosso-term-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "colosso_term_mcp"
path = "src/lib.rs"

[dependencies]
colosso-term-control = { path = "../term-control" }
# The daemon connection's inbox, which the watcher reads.
crossbeam-channel = "0.5"
log = "0.4"
parking_lot = "0.12"
# The MCP server, as monocode serves its own; stdio only, the catalog's tools built here.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
# rmcp's runtime; the catalog's calls block, so they run on its blocking threads.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
