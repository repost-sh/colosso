[package]
name = "colosso"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
colosso-git = { path = "../git" }
# Each checkout's files, scanned and watched once for every panel that shows it.
colosso-project = { path = "../project" }
# The language servers behind the file tabs: rust-analyzer, found or fetched, and talked to.
colosso-lsp = { path = "../lsp" }
# The browser panes' host process (crates/browser-host), talked to over this.
colosso-browser-ipc = { path = "../browser-ipc" }
# A search typed into a browser tab's address, encoded as a query: the version `url` (in
# GPUI's tree) already pulls in.
form_urlencoded = "1.2"
# The files a language server asked to hear about, matched by its globs: ripgrep's matcher,
# already in the lockfile.
globset = "0.4"
# The completions a server listed, ranked against the word as it's typed on: the matcher the
# command palette already uses (crates/project), so already in the lockfile.
nucleo-matcher = "0.3"
futures = "0.3"
# Syntax highlighting for diffs: syntect's parser with bat's syntaxes, which add TypeScript,
# TOML, Svelte and more. Pure-Rust regexes, so nothing to link.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The grammars the file tabs colour code with: picked by what a checkout usually holds. SQL's
# isn't among them: it pins `cc` below the version GPUI locks.
gpui-kit = { workspace = true, features = [
  "tree-sitter",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-tsx",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-go",
  "tree-sitter-toml",
  "tree-sitter-yaml",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-java",
  "tree-sitter-swift",
  "tree-sitter-kotlin",
  "tree-sitter-ruby",
  "tree-sitter-zig",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-proto",
  "tree-sitter-graphql",
  "tree-sitter-diff",
] }
# Only for the frames of bitmaps painted at runtime; the version GPUI already pulls in.
image = { version = "0.25", default-features = false }
# Settings on disk; all versions GPUI already pulls in.
dirs = "6"
# The log: the facade GPUI and gix already log through, and the clock its lines are stamped
# with, both already built for GPUI.
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
# A file written from outside lands in its editor as the difference, line by line; the
# version already in the lockfile.
similar = { version = "2", default-features = false, features = ["text"] }
serde_json = "1"
# Only named to turn on GPUI's hot-reload feature; it must match the version gpui-kit pins.
gpui-pre = { version = "=0.3.10", default-features = false, optional = true }

[dev-dependencies]
# Headless windows for measuring and testing views.
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Haptic ticks on the theme picker's detents; the version GPUI already pulls in.
objc = "0.2"
# The system's accent colour, under each appearance, and word when System Settings changes
# it; all versions GPUI already pulls in, with every feature named here already built.
objc2 = { version = "0.6", features = [
  # gpui-fast-apple reads a layer's colour space as a `void *` where the runtime says
  # `CGColorSpaceRef`; debug builds check message types, and would stop the app as soon as
  # a native view (the settings' sliders) turns window composition on.
  "relax-void-encoding",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAppearance",
  "NSColor",
  "NSColorSpace",
  # The settings' sliders and switches, which AppKit draws (native, settings_view/native_*).
  "NSApplication",
  "NSControl",
  # The blur behind the editor's cards (native/glass.rs).
  "NSVisualEffectView",
  "NSResponder",
  "NSSlider",
  "NSSliderCell",
  "NSSwitch",
  "NSCell",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
block2 = "0.6"
# The browser panes' frames: the host's `IOSurface`s, found from the mach ports it sends,
# shown as the contents of a layer. All versions GPUI already pulls in.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "objc2"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }

[features]
# Debug builds only: lets `dx serve --hot-patch` swap render code into the running app.
hot-reload = ["dep:gpui-pre", "gpui-pre/hot-reload"]
inspector = ["gpui-kit/inspector"]
# `--visual-check`: draws the Files panel in the real shell off screen and saves PNGs.
visual-check = ["gpui-kit/test-support"]

[lints]
workspace = true
