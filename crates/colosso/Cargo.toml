[package]
name = "colosso"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Only named to turn on GPUI's hot-reload feature; it must match the version gpui-kit pins.
gpui-pre = { version = "=0.3.10", default-features = false, optional = true }

[features]
# Debug builds only: lets `dx serve --hot-patch` swap render code into the running app.
hot-reload = ["dep:gpui-pre", "gpui-pre/hot-reload"]
inspector = ["gpui-kit/inspector"]
