[package]
name = "colosso"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
colosso-git = { path = "../git" }
# Each checkout's files, scanned and watched once for every panel that shows it.
colosso-project = { path = "../project" }
futures = "0.3"
# Syntax highlighting for diffs: syntect's parser with bat's syntaxes, which add TypeScript,
# TOML, Svelte and more. Pure-Rust regexes, so nothing to link.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The grammars the file tabs colour code with: picked by what a checkout usually holds. SQL's
# isn't among them: it pins `cc` below the version GPUI locks.
gpui-kit = { workspace = true, features = [
  "tree-sitter",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-tsx",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-go",
  "tree-sitter-toml",
  "tree-sitter-yaml",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-java",
  "tree-sitter-swift",
  "tree-sitter-kotlin",
  "tree-sitter-ruby",
  "tree-sitter-zig",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-proto",
  "tree-sitter-graphql",
  "tree-sitter-diff",
] }
# Only for the frames of bitmaps painted at runtime; the version GPUI already pulls in.
image = { version = "0.25", default-features = false }
# Settings on disk; all versions GPUI already pulls in.
dirs = "6"
# The log: the facade GPUI and gix already log through, and the clock its lines are stamped
# with, both already built for GPUI.
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only named to turn on GPUI's hot-reload feature; it must match the version gpui-kit pins.
gpui-pre = { version = "=0.3.10", default-features = false, optional = true }

[dev-dependencies]
# Headless windows for measuring and testing views.
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Haptic ticks on the theme picker's detents; the version GPUI already pulls in.
objc = "0.2"

[features]
# Debug builds only: lets `dx serve --hot-patch` swap render code into the running app.
hot-reload = ["dep:gpui-pre", "gpui-pre/hot-reload"]
inspector = ["gpui-kit/inspector"]
# `--visual-check`: draws the Files panel in the real shell off screen and saves PNGs.
visual-check = ["gpui-kit/test-support"]

[lints]
workspace = true
