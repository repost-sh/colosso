[package]
name = "koyo-desk-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "What Koyo's agent desktop agrees on between the app and its host: the link's messages and frames, shapes, key names (docs/agent-desktop.md)."

[dependencies]
# The link's frames are CBOR, as the terminal daemon's are: self-describing, and byte strings
# (screenshots) travel as they are.
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[lints]
workspace = true
