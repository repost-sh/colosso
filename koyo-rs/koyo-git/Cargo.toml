[package]
name = "koyo-git"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Status and diffs read in-process: no git process per call, files diffed in parallel.
# Creating and removing worktrees stays on the git CLI.
gix = { version = "0.90", default-features = false, features = ["sha1", "status", "max-performance"] }
# Discarding an untracked file moves it to the trash, so it can be put back.
trash = "5.2"
# Each git command run, at debug, through the facade the app's log reads.
log = "0.4"

[dev-dependencies]
# Counts the forks a test's thread makes: git is spawned, never forked from the app.
libc = "0.2"

[lints]
workspace = true
