[package]
name = "koyo-browser-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Koyo's browser host: CEF run inside the app, its pages Chromium's own views in the app's window, driven over koyo-browser-ipc."

[lib]
name = "koyo_browser_host"
path = "src/lib.rs"

[[bin]]
name = "koyo-browser-host"
path = "src/main.rs"

[dependencies]
koyo-browser-ipc = { path = "../koyo-browser-ipc" }
koyo-frame = { path = "../koyo-frame" }
koyo-seam = { path = "../koyo-seam" }
# Chromium, embedded: the exact version the distribution under .tools/cef matches
# (cef-dll-sys fetches it there and builds its C++ wrapper with script/cmake; script/cef
# builds its framework again with H.264 and AAC).
cef = { version = "=158.0.0", default-features = false, features = ["sandbox"] }
# The DevTools bridge: a websocket to Chromium's remote debugging port.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# The DevTools bridge's connection sleeps on its socket and its wake socket at once (`poll`).
libc = "0.2"
# What the host says when it runs inside Koyo, which keeps the log.
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Which suffixes of a domain are public (the Public Suffix List, built in), so a page's passkeys are
# never asked for a whole suffix such as `co.uk` or `github.io`.
psl = "2.1"
# A frame's origin from its address, as the URL standard parses it (hosts in punycode, `blob:`
# addresses by the origin inside).
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSNotification", "NSObject", "NSString", "NSBundle", "NSValue", "NSDate", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColor", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager"] }

[dev-dependencies]
tempfile = "3"

# The engine started in the test's own process, as Koyo starts it: CEF once, on the main
# thread, which the test owns (tests/embedded/main.rs).
[[test]]
name = "embedded"
path = "tests/embedded/main.rs"
harness = false

[lints]
workspace = true
