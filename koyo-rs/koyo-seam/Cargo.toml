[package]
name = "koyo-seam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The one owner of the seam between GPUI's window and the native views in it (docs/native-layer.md): its rules, kept apart from AppKit so they're tested as they run."

[features]
# The keyboard's fake `AppKit` (`keyboard::testing`), for other crates' tests.
testing = []

[dependencies]
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[lints]
workspace = true
