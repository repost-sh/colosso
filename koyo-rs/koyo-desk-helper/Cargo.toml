[package]
name = "koyo-desk-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Koyo's root helper for agent desktops: the hidden account, Screen Sharing for it alone, the loopback-only firewall, the host's install, and the daemon that does the rest (docs/agent-desktop.md 5)."

# Root runs this, so it depends on as little as it can: the shared contract, serde for its
# JSON lines, and libc for the terminal, the peer check and random bytes.
[dependencies]
koyo-desk-wire = { path = "../koyo-desk-wire" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
