[package]
name = "koyo-hygiene"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Holds Koyo's source to two rules with a real parser, and tells an agent how to fix each finding: no plain comments in Rust and TypeScript (deleted on --fix), and no import that closes a new cycle between the koyo crate's top-level modules (koyo-rs/module-edges.txt lists today's, and only shrinks)."

[dependencies]
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[lints]
workspace = true
