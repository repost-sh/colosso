[package]
name = "koyo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The chats: the agent host's protocol and client (`docs/chat.md` 5.1).
koyo-agent = { path = "../koyo-agent" }
# Claude accounts (`docs/claude-accounts.md`): the login switched, usage read, auto-switch.
koyo-accounts = { path = "../koyo-accounts" }
# A daemon's socket, reached however deep its folder is, as the visual checks stand in for one.
koyo-daemon = { path = "../koyo-daemon" }
# App control: the operations agents and scripts drive the window with, the control socket and
# `koyo app`, the CLI the app runs from its own executable.
koyo-app-control = { path = "../koyo-app-control" }
koyo-git = { path = "../koyo-git" }
# Terminals: the view and its client, the protocol's types, the engine's colours, and the
# daemon itself, which the app runs from its own executable as `koyo termd`.
koyo-term = { path = "../koyo-term" }
koyo-term-control = { path = "../koyo-term-control" }
koyo-term-engine = { path = "../koyo-term-engine" }
koyo-termd = { path = "../koyo-termd" }
koyo-term-mcp = { path = "../koyo-term-mcp" }
# The agent desktop (`docs/agent-desktop.md`): what the app and its host agree on.
koyo-desk-wire = { path = "../koyo-desk-wire" }
# Each checkout's files, scanned and watched once for every panel that shows it.
koyo-project = { path = "../koyo-project" }
# The language servers behind the file tabs: rust-analyzer, found or fetched, and talked to.
koyo-lsp = { path = "../koyo-lsp" }
# The browser panes' host process (koyo-rs/koyo-browser-host), talked to over this.
koyo-browser-ipc = { path = "../koyo-browser-ipc" }
# A search typed into a browser tab's address, encoded as a query: the version `url` (in
# GPUI's tree) already pulls in.
form_urlencoded = "1.2"
# The MCP server's install links for Cursor (base64) and VS Code (percent-encoded): versions
# already in the lockfile.
base64 = "0.22"
percent-encoding = "2.3"
# The files a language server asked to hear about, matched by its globs: ripgrep's matcher,
# already in the lockfile.
globset = "0.4"
# The completions a server listed, ranked against the word as it's typed on: the matcher the
# command palette already uses (koyo-rs/koyo-project), so already in the lockfile.
nucleo-matcher = "0.3"
futures = "0.3"
# Syntax highlighting for diffs: syntect's parser with bat's syntaxes, which add TypeScript,
# TOML, Svelte and more. Pure-Rust regexes, so nothing to link.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# The grammars the file tabs colour code with: picked by what a checkout usually holds. SQL's
# isn't among them: it pins `cc` below the version GPUI locks.
gpui-kit = { workspace = true, features = [
  "tree-sitter",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-tsx",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-go",
  "tree-sitter-toml",
  "tree-sitter-yaml",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-java",
  "tree-sitter-swift",
  "tree-sitter-kotlin",
  "tree-sitter-ruby",
  "tree-sitter-zig",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-proto",
  "tree-sitter-graphql",
  "tree-sitter-diff",
] }
# The frames of bitmaps painted at runtime, and the pictures a chat's message attaches, made to fit
# what the model takes; the version and the formats GPUI already pulls in.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# SVG files shown as pictures: the renderer GPUI already draws its SVGs with, built with the
# same features, so it adds nothing to the build. Only what's on screen is drawn, tile by tile.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# The Mermaid diagrams in a markdown file's preview, drawn without a browser: Zed's engine,
# laid out as Mermaid lays them out, as SVG GPUI paints; pinned, being an alpha. Its labels
# are measured in the font they're painted in (merman-export's native fonts), as estimated
# widths cut them short. ELK's layout, under the EPL, is left out.
merman = { version = "=0.10.0-alpha.1", default-features = false, features = ["svg", "all-diagrams", "layout-cytoscape", "native-fonts"] }
merman-export = { version = "=0.10.0-alpha.1", default-features = false, features = ["native-fonts"] }
# The markdown a chat's composer formats as it's typed, read as its text views read it: their
# parser, so already in the lockfile.
markdown = "1"
# Settings on disk; all versions GPUI already pulls in.
dirs = "6"
# The process on the other end of the agent desktop's socket, whose frames alone are taken.
libc = "0.2"
# The log: the facade GPUI and gix already log through, and the clock its lines are stamped
# with, both already built for GPUI.
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
# A file written from outside lands in its editor as the difference, line by line; the
# version already in the lockfile.
similar = { version = "2", default-features = false, features = ["text"] }
serde_json = "1"
# Only named to turn on GPUI's hot-reload feature; it must match the version gpui-kit pins.
gpui-pre = { version = "=0.3.10", default-features = false, optional = true }

[dev-dependencies]
# Headless windows for measuring and testing views.
gpui-kit = { workspace = true, features = ["test-support"] }
# The accounts on a sandbox: a fake `security`, a fake HTTP, never the real login.
koyo-accounts = { path = "../koyo-accounts", features = ["testing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI's Metal renderer, which draws a browser page's frame in the window's own frame, the
# part of the shared surface the page fills said by `set_surface_picture` (`vendor/README.md`).
gpui-fast-apple = "0.1.12"
# Haptic ticks on the theme picker's detents; the version GPUI already pulls in.
objc = "0.2"
# The system's accent colour, under each appearance, and word when System Settings changes
# it; all versions GPUI already pulls in, with every feature named here already built.
objc2 = { version = "0.6", features = [
  # gpui-fast-apple reads a layer's colour space as a `void *` where the runtime says
  # `CGColorSpaceRef`; debug builds check message types, and would stop the app as soon as
  # a native view (the settings' sliders) turns window composition on.
  "relax-void-encoding",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAppearance",
  "NSColor",
  "NSColorSpace",
  # The settings' sliders and switches, which AppKit draws (native, settings_view/native_*).
  "NSApplication",
  "NSControl",
  # The blur behind the editor's cards (native/glass.rs).
  "NSVisualEffectView",
  "NSResponder",
  "NSSlider",
  "NSSliderCell",
  "NSSwitch",
  "NSCell",
  "NSView",
  "NSWindow",
  # The traffic lights, faded in compact mode (native/traffic_lights.rs).
  "NSButton",
  # A native view's layer (native/liquid.rs).
  "objc2-quartz-core",
  # The Liquid Glass behind the app's bars over a page (native/liquid.rs).
  "NSGlassEffectView",
  # The app's icon in the Dock (native/icon.rs).
  "NSImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSData",
  # How the passkey sheet ended (browser/passkeys/sheet/).
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
block2 = "0.6"
# The window's view, to reach its traffic lights (native/traffic_lights.rs), and the `NSWindow`
# it's drawn in (native/window.rs); the version GPUI already pulls in.
raw-window-handle = "0.6"
# What a chat tells a person who isn't looking (native/notifications.rs).
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
# The browser panes' frames: the host's `IOSurface`s, found from the mach ports it sends,
# drawn by GPUI as pixel buffers. All versions GPUI already pulls in.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFBase",
  "CFCGTypes",
  "objc2",
  # The options and properties a picture is read with (viewer/).
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferIOSurface",
  "CVReturn",
  "objc2-io-surface",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "objc2-core-foundation",
] }
# Passkeys for the browser's pages (browser/passkeys/): the system's passkey sheet, which asks
# iCloud Keychain, the person's other credential providers, a phone or a security key.
objc2-authentication-services = { version = "0.3", default-features = false, features = [
  "std",
  "ASAuthorization",
  "ASAuthorizationController",
  "ASAuthorizationCredential",
  "ASAuthorizationError",
  "ASAuthorizationPlatformPublicKeyCredentialAssertion",
  "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest",
  "ASAuthorizationPlatformPublicKeyCredentialDescriptor",
  "ASAuthorizationPlatformPublicKeyCredentialProvider",
  "ASAuthorizationPlatformPublicKeyCredentialRegistration",
  "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest",
  "ASAuthorizationPublicKeyCredentialAssertion",
  "ASAuthorizationPublicKeyCredentialAssertionRequest",
  "ASAuthorizationPublicKeyCredentialConstants",
  "ASAuthorizationPublicKeyCredentialDescriptor",
  "ASAuthorizationPublicKeyCredentialParameters",
  "ASAuthorizationPublicKeyCredentialRegistration",
  "ASAuthorizationPublicKeyCredentialRegistrationRequest",
  "ASAuthorizationRequest",
  "ASAuthorizationSecurityKeyPublicKeyCredentialAssertion",
  "ASAuthorizationSecurityKeyPublicKeyCredentialAssertionRequest",
  "ASAuthorizationSecurityKeyPublicKeyCredentialDescriptor",
  "ASAuthorizationSecurityKeyPublicKeyCredentialProvider",
  "ASAuthorizationSecurityKeyPublicKeyCredentialRegistration",
  "ASAuthorizationSecurityKeyPublicKeyCredentialRegistrationRequest",
  "ASAuthorizationWebBrowserPlatformPublicKeyCredentialAssertionRequest",
  "ASAuthorizationWebBrowserPlatformPublicKeyCredentialProvider",
  "ASAuthorizationWebBrowserPlatformPublicKeyCredentialRegistrationRequest",
  "ASAuthorizationWebBrowserSecurityKeyPublicKeyCredentialProvider",
  "ASCOSEConstants",
  "ASFoundation",
  "ASPublicKeyCredential",
  "ASPublicKeyCredentialClientData",
] }
# Whether the app is signed with Apple's browser-passkey entitlement, read off its own task
# (browser/passkeys/), which it asks for passkeys only once it is.
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecTask"] }
# Pictures and PDFs shown in a file's tab (viewer/): drawn into bitmaps of their own, a PDF's
# pages by Quartz, the renderer Preview uses.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGAffineTransform",
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGImage",
  "CGPDFDocument",
  "CGPDFPage",
] }
# Pictures shown in a file's tab (viewer/): the system's decoders, which read every format
# Preview does (HEIC, AVIF, JPEG XL, RAW and the common ones), decode straight to the size
# shown, turn the photo upright and convert its colours to sRGB, at no cost to the binary.
objc2-image-io = { version = "0.3", default-features = false, features = [
  "std",
  "CGImageProperties",
  "CGImageSource",
  "objc2-core-graphics",
] }

[features]
# Debug builds only: lets `dx serve --hot-patch` swap render code into the running app.
hot-reload = ["dep:gpui-pre", "gpui-pre/hot-reload"]
inspector = ["gpui-kit/inspector"]
# `--visual-check`: draws the Files panel in the real shell off screen and saves PNGs.
visual-check = ["gpui-kit/test-support", "koyo-accounts/testing"]

[lints]
workspace = true
