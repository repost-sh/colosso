[package]
name = "koyo-term-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "koyo_term_mcp"
path = "src/lib.rs"

[dependencies]
# The app's operations, its control socket and the client the relay forwards app calls with.
koyo-app-control = { path = "../koyo-app-control" }
koyo-term-control = { path = "../koyo-term-control" }
# The daemon connection's inbox, which the watcher reads.
crossbeam-channel = "0.5"
log = "0.4"
parking_lot = "0.12"
# The MCP server, as monocode serves its own; stdio here, the handler generic over its
# transport so the app can serve it over Streamable HTTP too.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
# The HTTP server under rmcp's Streamable HTTP service, which the app runs; all already in
# the lockfile through rmcp and GPUI.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-util = "0.7"
# rmcp's runtime; the catalogs' calls block, so they run on its blocking threads, and
# app_launch and the app's reconnection wait on its timers.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[dev-dependencies]
# A real MCP client for the end-to-end tests, over an in-memory duplex.
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

[lints]
workspace = true
